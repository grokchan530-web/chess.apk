name: Build chess.apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project
        run: unzip -q chess-project.zip && ls chess

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test chess engine
        working-directory: chess
        run: node tests/perft.js && node tests/ai.js

      - name: Bundle the game into the Android assets
        working-directory: chess
        run: node build.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Make sure a debug keystore exists
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        working-directory: chess/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect chess.apk
        run: |
          APK=$(find chess/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "Built: $APK"
          cp "$APK" chess.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chess-apk
          path: chess.apk
