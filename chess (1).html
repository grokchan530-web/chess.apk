<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="mobile-web-app-capable" content="yes">
<title>Chess</title>
<style>:root{--ui:1;--accent:#4cc9f0;--fg:#eef2ff;--fg2:rgba(238,242,255,.62);--panel:rgba(16,20,32,.72);--sheet:rgba(14,17,28,.95);--line:rgba(255,255,255,.13);--chip:rgba(255,255,255,.09);--bgspeed:18s}
body.lightbg{--fg:#1b2030;--fg2:rgba(27,32,48,.62);--panel:rgba(255,255,255,.72);--sheet:rgba(250,250,253,.97);--line:rgba(0,0,0,.14);--chip:rgba(0,0,0,.07)}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--ui))}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;overflow:clip}
#bg,#bgdim{position:absolute;inset:-40px}
#bg{background:#0d0f14 center/cover no-repeat}
#bg.anim{background-size:300% 300%;animation:bgmove var(--bgspeed) ease-in-out infinite alternate}
@keyframes bgmove{0%{background-position:0% 30%}100%{background-position:100% 70%}}
#game{position:absolute;inset:0;display:grid;gap:.45rem;padding:max(.5rem,env(safe-area-inset-top)) max(.5rem,env(safe-area-inset-right)) max(.5rem,env(safe-area-inset-bottom)) max(.5rem,env(safe-area-inset-left));grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto minmax(0,1fr) auto auto;grid-template-areas:"top" "board" "bot" "moves" "actions";transition:filter .3s,opacity .3s}
#game.land #plateTop,#game.land #plateBot{align-self:stretch}#game.land #boardwrap{aspect-ratio:auto;width:auto;justify-self:stretch}
#game.land{grid-template-columns:minmax(0,1fr) clamp(250px,36vw,400px);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"board top" "board moves" "board bot" "board actions"}
#game.land.lefty{grid-template-columns:clamp(250px,36vw,400px) minmax(0,1fr);grid-template-areas:"top board" "moves board" "bot board" "actions board"}
#game.rotating{filter:blur(7px);opacity:.55;transition:none}
#plateTop{grid-area:top;align-self:end}#plateBot{grid-area:bot;align-self:start}#boardwrap{grid-area:board;position:relative;min-height:0;min-width:0;aspect-ratio:1/1;width:min(100%,calc(100vh - 14.5rem));justify-self:center}#moves{grid-area:moves}#actions{grid-area:actions}
#board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none;display:block}
.plate{display:flex;align-items:center;gap:.6rem;padding:.4rem .7rem;border-radius:.9rem;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-height:2.9rem;transition:box-shadow .2s,border-color .2s}
.plate.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 14px -2px var(--accent)}
.plate.rot180{transform:rotate(180deg)}
.plate .who{display:flex;flex-direction:column;min-width:0;flex:0 1 auto}
.plate .name{font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:.4rem}
.plate .sub{font-size:.72rem;color:var(--fg2);min-height:1em}
.plate .dot{width:.8rem;height:.8rem;border-radius:50%;border:2px solid var(--line);flex:none}
.plate .capw{flex:1;display:flex;align-items:center;min-width:0;overflow:hidden;height:1.5rem}
.plate .capw canvas{width:1.25rem;height:1.25rem;margin-right:-.5rem;flex:none}
.plate .adv{font-size:.75rem;font-weight:700;color:var(--fg2);margin-left:.8rem;flex:none}
.plate .clk{font-variant-numeric:tabular-nums;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:800;font-size:1.3rem;padding:.15rem .55rem;border-radius:.6rem;background:var(--chip);margin-left:auto;flex:none}
.plate.noclock .clk{display:none}
.plate.low .clk{color:#ff5d5d;background:rgba(255,60,60,.16)}
.plate .think{display:none;gap:3px;align-items:center}
.plate.thinking .think{display:inline-flex}
.think i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
body.nocap .capw,body.nocap .adv{display:none}
#moves{background:var(--panel);border:1px solid var(--line);border-radius:.9rem;padding:.35rem .7rem;font-size:.82rem;overflow-x:auto;overflow-y:hidden;white-space:nowrap;min-height:2rem;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);scrollbar-width:none}
#moves::-webkit-scrollbar{display:none}
#moves .mv{display:inline-block;margin-right:.7rem}
#moves .n{color:var(--fg2);margin-right:.2rem}
#moves .last{color:var(--accent);font-weight:700}
#game.land #moves{white-space:normal;overflow-y:auto;overflow-x:hidden;min-height:0}
body.nomoves #moves{display:none}
#actions{display:flex;gap:.35rem;justify-content:space-between}
.btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:.45rem .2rem;border-radius:.9rem;background:var(--panel);border:1px solid var(--line);font-size:.62rem;color:var(--fg);min-height:3rem;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .08s,background .15s}
.btn:active{transform:scale(.94);background:var(--chip)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn svg{width:1.35rem;height:1.35rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.hide{display:none}
#think{position:absolute;inset:0;pointer-events:none}
#fps{position:absolute;left:8px;top:8px;font:700 12px ui-monospace,Menlo,monospace;color:#9dff9d;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px;pointer-events:none;display:none;z-index:50}
#toast{position:absolute;left:50%;bottom:18%;transform:translate(-50%,10px);background:rgba(10,12,20,.92);color:#fff;padding:.55rem .95rem;border-radius:999px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:86vw;text-align:center;border:1px solid rgba(255,255,255,.15)}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* overlays */
.overlay{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(5,7,12,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:1rem;animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
.card{background:var(--sheet);color:var(--fg);border:1px solid var(--line);border-radius:1.2rem;padding:1.1rem;width:min(92vw,25rem);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .22s}
.card h2{margin:0 0 .2rem;font-size:1.35rem}
.card .sub2{color:var(--fg2);font-size:.88rem;margin-bottom:.8rem}
.cbtns{display:flex;flex-direction:column;gap:.5rem;margin-top:.9rem}
.cbtns.row2{flex-direction:row}
.cbtn{flex:1;padding:.8rem 1rem;border-radius:.9rem;background:var(--chip);border:1px solid var(--line);font-weight:700;font-size:.95rem;text-align:center}
.cbtn.pri{background:var(--accent);color:#06121a;border-color:transparent}
.cbtn.danger{color:#ff6b6b}
.cbtn:active{transform:scale(.97)}
.promo{display:flex;gap:.6rem;justify-content:center;margin-top:.7rem}
.promo button{background:var(--chip);border:1px solid var(--line);border-radius:.9rem;padding:.4rem}
.promo canvas{width:3.6rem;height:3.6rem;display:block}
#home{background:rgba(4,6,12,.35)}
#home .card{text-align:center;width:min(92vw,22rem)}
#home .logo{width:5.5rem;height:5.5rem;margin:0 auto .3rem;display:block}
#home h1{margin:0;font-size:2.3rem;letter-spacing:.18em;font-weight:900}
#home .tag{color:var(--fg2);margin:.1rem 0 .6rem;font-size:.9rem}
/* settings sheet */
#sheet{position:absolute;z-index:70;inset:0;overflow:hidden;display:flex;flex-direction:column;background:var(--sheet);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:max(.4rem,env(safe-area-inset-top)) max(.4rem,env(safe-area-inset-right)) max(.4rem,env(safe-area-inset-bottom)) max(.4rem,env(safe-area-inset-left));transition:opacity .12s,transform .25s;transform:translateY(100%)}
#sheet.open{transform:none}
#sheet.peek{opacity:0}
@media (orientation:landscape) and (min-width:700px){#sheet{left:auto;width:min(46vw,34rem);border-left:1px solid var(--line)}#sheet.lefty{left:0;right:auto;border-left:0;border-right:1px solid var(--line)}}
.shead{display:flex;align-items:center;gap:.4rem;padding:.3rem .4rem}
.shead h2{margin:0;font-size:1.2rem;flex:1}
.sbtn{padding:.5rem .8rem;border-radius:.8rem;background:var(--chip);border:1px solid var(--line);font-size:.85rem;font-weight:700}
.sbtn.pri{background:var(--accent);color:#06121a;border-color:transparent}
.tabs{display:flex;gap:.3rem;overflow-x:auto;padding:.3rem .3rem .5rem;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.45rem .85rem;border-radius:999px;background:var(--chip);font-size:.85rem;font-weight:700;white-space:nowrap;flex:none}
.tab.on{background:var(--accent);color:#06121a}
.sbody{flex:1;min-height:0;overflow-y:auto;padding:0 .4rem 2rem;-webkit-overflow-scrolling:touch}
.banner{margin:.3rem 0 .6rem;padding:.6rem .8rem;border-radius:.8rem;background:rgba(255,190,60,.16);border:1px solid rgba(255,190,60,.4);font-size:.85rem;display:flex;gap:.6rem;align-items:center}
.banner span{flex:1}
.head{margin:1.1rem 0 .3rem;font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.row{padding:.62rem 0;border-bottom:1px solid var(--line)}
.rtop{display:flex;align-items:center;gap:.6rem;min-height:1.9rem}
.lab{flex:1;font-size:.93rem}
.val{font-variant-numeric:tabular-nums;color:var(--fg2);font-size:.85rem;font-weight:700}
.switch{width:2.9rem;height:1.65rem;border-radius:999px;background:var(--chip);border:1px solid var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:calc(1.65rem - 6px);height:calc(1.65rem - 6px);border-radius:50%;background:var(--fg2);transition:transform .15s,background .15s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(1.25rem);background:#fff}
input[type=range]{width:100%;margin:.4rem 0 .1rem;accent-color:var(--accent);height:1.6rem}
.seg{display:flex;background:var(--chip);border-radius:.8rem;padding:3px;gap:3px;margin-top:.4rem}
.seg button{flex:1;padding:.5rem .3rem;border-radius:.6rem;font-size:.82rem;font-weight:600;color:var(--fg2)}
.seg button.on{background:var(--accent);color:#06121a}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.45rem}
.chips button{padding:.45rem .8rem;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:.82rem;font-weight:600}
.chips button.on{background:var(--accent);color:#06121a;border-color:transparent}
.crow{display:flex;align-items:center;gap:.5rem}
input[type=color]{width:2.6rem;height:2rem;border:1px solid var(--line);border-radius:.5rem;background:none;padding:2px}
.abtn{width:100%;padding:.75rem;border-radius:.8rem;background:var(--chip);border:1px solid var(--line);font-weight:700;font-size:.9rem}
.abtn.danger{color:#ff6b6b}
textarea{width:100%;min-height:8rem;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:.7rem;padding:.6rem;font:12px ui-monospace,Menlo,monospace;user-select:text;-webkit-user-select:text}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div><div id="bgdim"></div>
  <div id="game">
    <div class="plate" id="plateTop"></div>
    <div id="boardwrap"><canvas id="board"></canvas></div>
    <div class="plate" id="plateBot"></div>
    <div id="moves"></div>
    <div id="actions"></div>
  </div>
  <div id="fps">0 fps</div>
  <div id="overlays"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
  <input type="file" id="bgfile" accept="image/*" style="display:none">
</div>
<script id="engine-src" type="text/plain">/* ===== Chess engine: 0x88 board, legal move generation, SAN, draw rules ===== */
const Chess = (function () {
'use strict';

const P = 1, N = 2, B = 3, R = 4, Q = 5, K = 6;
const KNIGHT_D = [33, 31, 18, 14, -14, -18, -31, -33];
const KING_D = [1, -1, 16, -16, 17, 15, -15, -17];
const BISHOP_D = [17, 15, -15, -17];
const ROOK_D = [1, -1, 16, -16];
const FILES = 'abcdefgh';
const PCH = '.PNBRQK';
const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

function sqName(s) { return FILES[s & 7] + ((s >> 4) + 1); }
function nameSq(n) { return (n.charCodeAt(0) - 97) + (parseInt(n[1], 10) - 1) * 16; }
function mFrom(m) { return m & 127; }
function mTo(m) { return (m >> 7) & 127; }
function mPromo(m) { return (m >> 14) & 7; }
function mFlags(m) { return m >> 17; }
function mk(from, to, promo, flags) { return from | (to << 7) | ((promo || 0) << 14) | ((flags || 0) << 17); }

// ---- Zobrist ----
let seed = 0x9e3779b9;
function rnd() { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return seed | 0; }
const Z_PIECE = [];
for (let p = 0; p < 16; p++) { const a = new Int32Array(128); for (let s = 0; s < 128; s++) a[s] = rnd(); Z_PIECE.push(a); }
const Z_CASTLE = new Int32Array(16); for (let i = 0; i < 16; i++) Z_CASTLE[i] = rnd();
const Z_EP = new Int32Array(8); for (let i = 0; i < 8; i++) Z_EP[i] = rnd();
const Z_SIDE = rnd();

const CASTLE_MASK = new Int8Array(128).fill(15);
CASTLE_MASK[4] = 12; CASTLE_MASK[0] = 13; CASTLE_MASK[7] = 14;
CASTLE_MASK[116] = 3; CASTLE_MASK[112] = 7; CASTLE_MASK[119] = 11;

class Position {
  constructor() {
    this.board = new Int8Array(128);
    this.turn = 0; this.castle = 0; this.ep = -1; this.half = 0; this.full = 1;
    this.king = [4, 116]; this.hash = 0;
    this.sp = 0;
    this.sCap = []; this.sCas = []; this.sEp = []; this.sHalf = []; this.sHash = []; this.sMove = [];
    this.setFen(START_FEN);
  }

  setFen(fen) {
    const parts = fen.trim().split(/\s+/);
    this.board.fill(0);
    const rows = parts[0].split('/');
    for (let r = 0; r < 8; r++) {
      const row = rows[7 - r]; let f = 0;
      for (const ch of row) {
        if (ch >= '1' && ch <= '8') { f += +ch; continue; }
        const lower = ch.toLowerCase();
        const t = PCH.indexOf(lower.toUpperCase());
        const c = ch === lower ? 8 : 0;
        const sq = r * 16 + f;
        this.board[sq] = c | t;
        if (t === K) this.king[c ? 1 : 0] = sq;
        f++;
      }
    }
    this.turn = parts[1] === 'b' ? 1 : 0;
    this.castle = 0;
    const cs = parts[2] || '-';
    if (cs.includes('K')) this.castle |= 1;
    if (cs.includes('Q')) this.castle |= 2;
    if (cs.includes('k')) this.castle |= 4;
    if (cs.includes('q')) this.castle |= 8;
    this.ep = parts[3] && parts[3] !== '-' ? nameSq(parts[3]) : -1;
    this.half = parseInt(parts[4] || '0', 10) || 0;
    this.full = parseInt(parts[5] || '1', 10) || 1;
    this.sp = 0;
    this.hash = this.computeHash();
  }

  fen() {
    let s = '';
    for (let r = 7; r >= 0; r--) {
      let e = 0;
      for (let f = 0; f < 8; f++) {
        const p = this.board[r * 16 + f];
        if (!p) { e++; continue; }
        if (e) { s += e; e = 0; }
        const ch = PCH[p & 7];
        s += (p >> 3) ? ch.toLowerCase() : ch;
      }
      if (e) s += e;
      if (r) s += '/';
    }
    let c = '';
    if (this.castle & 1) c += 'K';
    if (this.castle & 2) c += 'Q';
    if (this.castle & 4) c += 'k';
    if (this.castle & 8) c += 'q';
    return s + ' ' + (this.turn ? 'b' : 'w') + ' ' + (c || '-') + ' ' + (this.ep >= 0 ? sqName(this.ep) : '-') + ' ' + this.half + ' ' + this.full;
  }

  // position key for repetition detection (placement + side + castling + ep only if capturable)
  repKey() {
    const f = this.fen().split(' ');
    let ep = '-';
    if (this.ep >= 0) {
      const dir = this.turn === 0 ? -16 : 16; // pawns that could capture sit behind ep square from mover's view
      const mine = this.turn === 0 ? P : (8 | P);
      for (const d of [dir - 1, dir + 1]) {
        const s = this.ep + d;
        if (!(s & 0x88) && this.board[s] === mine) ep = f[3];
      }
    }
    return f[0] + ' ' + f[1] + ' ' + f[2] + ' ' + ep;
  }

  computeHash() {
    let h = 0;
    for (let s = 0; s < 128; s++) {
      if (s & 0x88) { s += 7; continue; }
      const p = this.board[s];
      if (p) h ^= Z_PIECE[p][s];
    }
    h ^= Z_CASTLE[this.castle];
    if (this.ep >= 0) h ^= Z_EP[this.ep & 7];
    if (this.turn) h ^= Z_SIDE;
    return h | 0;
  }

  isAttacked(sq, by) {
    const b = this.board, cb = by << 3;
    let s;
    if (by === 0) {
      s = sq - 15; if (!(s & 0x88) && b[s] === P) return true;
      s = sq - 17; if (!(s & 0x88) && b[s] === P) return true;
    } else {
      s = sq + 15; if (!(s & 0x88) && b[s] === (8 | P)) return true;
      s = sq + 17; if (!(s & 0x88) && b[s] === (8 | P)) return true;
    }
    const kn = cb | N, kg = cb | K;
    for (let i = 0; i < 8; i++) {
      s = sq + KNIGHT_D[i]; if (!(s & 0x88) && b[s] === kn) return true;
      s = sq + KING_D[i]; if (!(s & 0x88) && b[s] === kg) return true;
    }
    const bi = cb | B, ro = cb | R, qu = cb | Q;
    for (let i = 0; i < 4; i++) {
      let d = BISHOP_D[i]; s = sq + d;
      while (!(s & 0x88)) { const p = b[s]; if (p) { if (p === bi || p === qu) return true; break; } s += d; }
      d = ROOK_D[i]; s = sq + d;
      while (!(s & 0x88)) { const p = b[s]; if (p) { if (p === ro || p === qu) return true; break; } s += d; }
    }
    return false;
  }

  inCheck() { return this.isAttacked(this.king[this.turn], this.turn ^ 1); }

  // Pseudo-legal move generation into buf; returns count
  genMoves(buf, capsOnly) {
    let n = 0;
    const b = this.board, us = this.turn, them = us ^ 1;
    const PROMOS = [Q, R, B, N];
    for (let sq = 0; sq < 128; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      const p = b[sq];
      if (!p || (p >> 3) !== us) continue;
      const t = p & 7;
      if (t === P) {
        const dir = us === 0 ? 16 : -16;
        const startRank = us === 0 ? 1 : 6, promoRank = us === 0 ? 6 : 1;
        const r = sq >> 4;
        const to1 = sq + dir;
        if (!(to1 & 0x88) && b[to1] === 0) {
          if (r === promoRank) { for (let k = 0; k < 4; k++) buf[n++] = mk(sq, to1, PROMOS[k], 0); }
          else if (!capsOnly) {
            buf[n++] = mk(sq, to1, 0, 0);
            if (r === startRank) { const to2 = sq + 2 * dir; if (b[to2] === 0) buf[n++] = mk(sq, to2, 0, 4); }
          }
        }
        for (let k = 0; k < 2; k++) {
          const to = sq + dir + (k ? 1 : -1);
          if (to & 0x88) continue;
          const c = b[to];
          if (c && (c >> 3) === them) {
            if (r === promoRank) { for (let j = 0; j < 4; j++) buf[n++] = mk(sq, to, PROMOS[j], 1); }
            else buf[n++] = mk(sq, to, 0, 1);
          } else if (!c && to === this.ep) {
            buf[n++] = mk(sq, to, 0, 3);
          }
        }
      } else if (t === N || t === K) {
        const D = t === N ? KNIGHT_D : KING_D;
        for (let i = 0; i < 8; i++) {
          const to = sq + D[i];
          if (to & 0x88) continue;
          const c = b[to];
          if (!c) { if (!capsOnly) buf[n++] = mk(sq, to, 0, 0); }
          else if ((c >> 3) === them) buf[n++] = mk(sq, to, 0, 1);
        }
      } else {
        const D = t === B ? BISHOP_D : t === R ? ROOK_D : KING_D;
        const cnt = t === Q ? 8 : 4;
        for (let i = 0; i < cnt; i++) {

<script>/* ===== Chess engine: 0x88 board, legal move generation, SAN, draw rules ===== */

  }

            if ((of & 7) === (from & 7)) sameFile = true;
            if ((of >> 4) === (from >> 4)) sameRank = true;
          }
        }
        if (amb) {
          if (!sameFile) s += FILES[from & 7];
          else if (!sameRank) s += ((from >> 4) + 1);
          else s += sqName(from);
        }
      } else if (capture) s += FILES[from & 7];
      if (capture) s += 'x';
      s += sqName(to);
      if (promo) s += '=' + PCH[promo];
    }
    this.make(m);
    if (this.inCheck()) s += this.legalMoves().length === 0 ? '#' : '+';

  }

  insufficient() {
    const minors = [];
    for (let s = 0; s < 128; s++) {
      if (s & 0x88) { s += 7; continue; }
      const p = this.board[s]; if (!p) continue;
      const t = p & 7;
      if (t === K) continue;
      if (t === P || t === R || t === Q) return false;
      minors.push({ t, c: ((s & 7) + (s >> 4)) & 1 });
    }
    if (minors.length <= 1) return true;
    return minors.every(x => x.t === B && x.c === minors[0].c);
  }

  // Basic status (no threefold; the game controller tracks repetitions)
  status() {
    const legal = this.legalMoves();
    if (legal.length === 0) {
      if (this.inCheck()) return { over: true, result: this.turn ? '1-0' : '0-1', reason: 'checkmate' };
      return { over: true, result: '1/2-1/2', reason: 'stalemate' };
    }
    if (this.insufficient()) return { over: true, result: '1/2-1/2', reason: 'insufficient material' };
    if (this.half >= 100) return { over: true, result: '1/2-1/2', reason: 'fifty-move rule' };
    return { over: false, result: '*', reason: '' };
  }

  perft(depth) {
    if (depth === 0) return 1;
    const buf = new Int32Array(256);
    const n = this.genMoves(buf, false);
    let c = 0; const us = this.turn;
    for (let i = 0; i < n; i++) {
      this.make(buf[i]);
      if (!this.isAttacked(this.king[us], us ^ 1)) c += depth === 1 ? 1 : this.perft(depth - 1);
      this.unmake();
    }
    return c;
  }
}

return { Position, P, N, B, R, Q, K, FILES, PCH, START_FEN, sqName, nameSq, mFrom, mTo, mPromo, mFlags, mk };
})();

<script>/* ===== Settings schema, presets and persistence ===== */

  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },

function hex2rgb(h) {

function sanitizeInto(target, o) {
  for (const d of DEFS) {
    if (!d.key || !(d.key in o)) continue;
    const v = o[d.key];
    if (d.type === 'toggle' && typeof v === 'boolean') target[d.key] = v;
    else if (d.type === 'slider' && typeof v === 'number' && isFinite(v)) target[d.key] = Math.max(d.min, Math.min(d.max, v));
    else if (d.type === 'color' && typeof v === 'string' && isHex(v)) target[d.key] = v;
    else if ((d.type === 'seg' || d.type === 'chips')) {
      const hit = d.opts.find(o2 => String(o2[0]) === String(v));
      if (hit) target[d.key] = hit[0];
    }
  }
  return target;
}
function loadSettings() {
  const s = Object.assign({}, DEFAULTS);
  try { const raw = LS.get(SETTINGS_KEY); if (raw) sanitizeInto(s, JSON.parse(raw)); } catch (e) {}
  return s;
}
let saveTimer = 0;
function saveSettings() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => LS.set(SETTINGS_KEY, JSON.stringify(S)), 250);

<script>/* ===== Synthesised sound effects (no audio files, fully offline) + haptics + Android bridge ===== */
const AB = (typeof window !== 'undefined' && window.Android) ? window.Android : null;
function bridge(fn) {
  try { if (AB && typeof AB[fn] === 'function') return AB[fn].apply(AB, Array.prototype.slice.call(arguments, 1)); } catch (e) {}
  return undefined;
}

const Snd = {
  ctx: null, master: null, noiseBuf: null,
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.connect(this.ctx.destination);
        const len = this.ctx.sampleRate * 0.5;
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  tone(freq, dur, type, vol, slideTo, delay) {
    const c = this.ctx; if (!c) return;
    const t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol, freq, q, delay) {
    const c = this.ctx; if (!c) return;
    const t0 = c.currentTime + (delay || 0);
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0, Math.random() * 0.3); src.stop(t0 + dur + 0.02);
  },
  play(name) {
    if (!S.sound || S.volume <= 0) return;
    this.unlock();
    const c = this.ctx; if (!c) return;
    this.master.gain.value = Math.pow(S.volume / 100, 1.6);
    const th = S.soundTheme;
    const T = {
      wood: {
        move() { Snd.tone(180, 0.09, 'triangle', 0.7, 90); Snd.noise(0.05, 0.5, 1800, 1.2); },
        capture() { Snd.tone(140, 0.16, 'triangle', 0.9, 60); Snd.noise(0.12, 0.8, 1200, 0.9); Snd.noise(0.05, 0.5, 3000, 2, 0.02); },
        select() { Snd.noise(0.03, 0.25, 2600, 2); },
      },
      soft: {
        move() { Snd.tone(330, 0.12, 'sine', 0.5, 240); },
        capture() { Snd.tone(260, 0.2, 'sine', 0.7, 140); Snd.noise(0.08, 0.3, 900, 0.8); },
        select() { Snd.tone(600, 0.04, 'sine', 0.2); },
      },
      retro: {
        move() { Snd.tone(440, 0.07, 'square', 0.22, 330); },
        capture() { Snd.tone(300, 0.12, 'square', 0.28, 90); Snd.tone(180, 0.1, 'square', 0.2, 60, 0.05); },
        select() { Snd.tone(880, 0.03, 'square', 0.12); },
      },
      glass: {
        move() { Snd.tone(1100, 0.14, 'sine', 0.35, 800); Snd.tone(1650, 0.1, 'sine', 0.15, 1200); },
        capture() { Snd.tone(900, 0.22, 'sine', 0.45, 400); Snd.tone(1800, 0.14, 'triangle', 0.2, 600); Snd.noise(0.06, 0.25, 5000, 3); },
        select() { Snd.tone(1500, 0.04, 'sine', 0.15); },
      },
    }[th] || {};
    const base = {
      castle() { (T.move || (() => {}))(); setTimeout(() => (T.move || (() => {}))(), 90); },
      promote() { Snd.tone(523, 0.12, 'triangle', 0.4); Snd.tone(659, 0.12, 'triangle', 0.4, 0, 0.07); Snd.tone(784, 0.2, 'triangle', 0.4, 0, 0.14); },
      check() { Snd.tone(880, 0.12, 'square', 0.18); Snd.tone(880, 0.16, 'square', 0.18, 0, 0.14); },
      illegal() { Snd.tone(120, 0.14, 'sawtooth', 0.22, 80); },
      tick() { Snd.noise(0.025, 0.35, 3500, 3); },
      start() { Snd.tone(392, 0.1, 'triangle', 0.35); Snd.tone(523, 0.16, 'triangle', 0.35, 0, 0.09); },
      win() { [523, 659, 784, 1047].forEach((f, i) => Snd.tone(f, 0.22, 'triangle', 0.4, 0, i * 0.11)); },
      lose() { [392, 330, 262].forEach((f, i) => Snd.tone(f, 0.28, 'triangle', 0.4, 0, i * 0.16)); },
      draw() { Snd.tone(440, 0.2, 'triangle', 0.35); Snd.tone(440, 0.3, 'triangle', 0.3, 0, 0.18); },
      flip() { Snd.noise(0.18, 0.18, 700, 0.6); },
    };
    const fn = T[name] || base[name];
    if (fn) try { fn(); } catch (e) {}
  },
};

function haptic(kind) {
  if (!S.haptics) return;
  const len = Math.round(S.hapticStrength * (kind === 'big' ? 2.2 : kind === 'mid' ? 1.4 : 1));
  if (AB) bridge('vibrate', len);
  else try { if (navigator.vibrate) navigator.vibrate(len); } catch (e) {}
}

  moves: [], sans: [], snaps: [], reps: [], redo: [], captured: [[], []],
  mode: 'ai', human: 0, aiColor: 1, levelName: 'Club',
  over: false, result: '*', reason: '',

  init() {

      const w = new Worker(URL.createObjectURL(blob));

}

}

  }
  bg.style.filter = S.bgBlur ? 'blur(' + S.bgBlur + 'px)' : '';
  $('bgdim').style.background = 'rgba(0,0,0,' + (S.bgDim / 100) + ')';
}
function applyLayoutClasses() { $('game').classList.toggle('lefty', !!S.leftHanded); $('sheet').classList.toggle('lefty', !S.leftHanded === false ? true : false); }

// ---------- background image ----------
function initBgPicker() {
  $('bgfile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => {
      const max = 1280, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      let data = cv.toDataURL('image/jpeg', 0.82);
      if (data.length > 2.2e6) data = cv.toDataURL('image/jpeg', 0.6);
      if (LS.set(BG_KEY, data)) { S.bgType = 'image'; saveSettings(); applyTheme(); renderSheet(); UI.toast('Background set'); }
      else UI.toast('Image too large to store');
    };
    img.onerror = () => UI.toast('Could not read that image');
    img.src = url; e.target.value = '';
  });
}

// ---------- actions ----------
function copyText(text, msg) {
  if (AB && typeof AB.copy === 'function') { bridge('copy', text); UI.toast(msg); return; }
  try { navigator.clipboard.writeText(text).then(() => UI.toast(msg), () => UI.toast('Copy failed')); } catch (e) { UI.toast('Copy failed'); }
}
function doAction(a) {
  if (a === 'pickBg') $('bgfile').click();
  else if (a === 'clearBg') { LS.del(BG_KEY); applyTheme(); UI.toast('Background removed'); renderSheet(); }
  else if (a === 'sharePgn') {
    const pgn = buildPgn();
    if (AB && typeof AB.share === 'function') bridge('share', pgn);
    else if (navigator.share) navigator.share({ text: pgn }).catch(() => {});
    else copyText(pgn, 'PGN copied');
  }
  else if (a === 'copyFen') copyText(G.pos.fen(), 'FEN copied');
  else if (a === 'copySettings') copyText(JSON.stringify(S), 'Settings copied');
  else if (a === 'importSettings') {
    UI.dialog({
      title: 'Import settings', sub: 'Paste settings JSON exported from this app.',
      body(b) { const t = document.createElement('textarea'); t.id = 'impText'; b.appendChild(t); },
      buttons: [{ label: 'Import', cls: 'pri', fn: () => {
        try { sanitizeInto(S, JSON.parse($('impText').value)); saveSettings(); applyKeys(new Set(Object.keys(DEFBY))); renderSheet(); UI.toast('Settings imported'); }
        catch (e) { UI.toast('Invalid settings text'); }
      } }, { label: 'Cancel' }],
    });
  }
  else if (a === 'resetAll') UI.confirm('Reset all settings to defaults?', 'Reset', () => {
    Object.assign(S, DEFAULTS); LS.del(SETTINGS_KEY); LS.del(BG_KEY);
    applyKeys(new Set(Object.keys(DEFBY))); renderSheet(); UI.toast('Settings reset');
  });
}

// ---------- settings sheet ----------
function openSheet() {
  UI.sheetOpen = true; UI.pendingNew = false; renderSheet();
  requestAnimationFrame(() => $('sheet').classList.add('open'));
}
function closeSheet() {
  if (!UI.sheetOpen) return;
  UI.sheetOpen = false; $('sheet').classList.remove('open'); $('sheet').classList.remove('peek');
  applyKeys(new Set(['twoPView']));
}
function renderSheetBanner() {
  const old = document.querySelector('#sheet .banner'); if (old) old.remove();
  if (!UI.pendingNew || !UI.sheetOpen) return;
  const b = el('div', 'banner'); b.appendChild(el('span', '', 'Mode / colour / clock changes apply to a new game.'));
  const btn = el('button', 'sbtn pri', 'Start now'); btn.onclick = () => { closeSheet(); newGame(); }; b.appendChild(btn);
  const body = document.querySelector('#sheet .sbody'); if (body) body.prepend(b);
}
function renderSheet() {
  const sh = $('sheet'), prev = sh.querySelector('.sbody'), st = prev ? prev.scrollTop : 0;
  sh.innerHTML = '';
  const head = el('div', 'shead'); head.appendChild(el('h2', '', 'Settings'));
  const peek = el('button', 'sbtn', 'Hold: preview');
  const up = () => { sh.classList.remove('peek'); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); };
  peek.addEventListener('pointerdown', () => { sh.classList.add('peek'); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up); });
  head.appendChild(peek);
  const close = el('button', 'sbtn pri', 'Done'); close.onclick = () => closeSheet(); head.appendChild(close);
  sh.appendChild(head);
  const tabs = el('div', 'tabs');
  for (const t of TABS) { const b = el('button', 'tab' + (t === UI.tab ? ' on' : ''), t); b.onclick = () => { UI.tab = t; renderSheet(); const bd = sh.querySelector('.sbody'); if (bd) bd.scrollTop = 0; }; tabs.appendChild(b); }
  sh.appendChild(tabs);
  const body = el('div', 'sbody');
  const onChange = (d, v) => { setValue(d, v); renderSheet(); };
  for (const d of DEFS) {
    if (d.tab !== UI.tab) continue;
    if (d.show && !d.show(S)) continue;
    body.appendChild(buildControl(d, onChange));
  }
  sh.appendChild(body);
  body.scrollTop = st;
  const act = tabs.querySelector('.tab.on'); if (act) tabs.scrollLeft = act.offsetLeft - (tabs.clientWidth - act.offsetWidth) / 2;
  renderSheetBanner();
}
if (!DEFS.some(d => d.action === 'copySettings')) {
  const i = DEFS.findIndex(d => d.action === 'resetAll');
  DEFS.splice(i, 0, { tab: 'More', type: 'action', label: 'Copy settings (backup)', action: 'copySettings' }, { tab: 'More', type: 'action', label: 'Import settings…', action: 'importSettings' });
}

// ---------- layout ----------
let lastLand = null, rotTimer = 0;
function doLayout(force) {
  const w = window.innerWidth, h = window.innerHeight, land = w > h * 1.1;
  const game = $('game');
  if (lastLand !== null && land !== lastLand && S.flipBlur && S.motionBlur > 0) {
    game.style.setProperty('transition', 'none'); game.classList.add('rotating');
    clearTimeout(rotTimer);
    rotTimer = setTimeout(() => { game.style.removeProperty('transition'); game.classList.remove('rotating'); }, 60);
  }
  lastLand = land;
  game.classList.toggle('land', land);
  const wrap = $('boardwrap');
  const side = Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight));
  if (side > 40 && (force || side !== R.side)) R.resize(side);
}
UI.layout = doLayout;
window.__back = function () {
  if (UI.modals.length) {
    const top = UI.modals[UI.modals.length - 1];
    if (top.ov.id === 'home') return false;
    UI.closeDialog(top); return true;
  }
  if (UI.sheetOpen) { closeSheet(); return true; }
  UI.menuDialog(); return true;
};
</script>
<script>/* ===== Boot ===== */
(function boot() {
  buildActions();
  initBgPicker();
  AI.init();
  R.init($('board'), $('fps'));

  const pd = new Set(Object.keys(DEFBY));
  applyTheme();
  applyKeys(pd);
  $('game').classList.toggle('lefty', !!S.leftHanded);
  $('sheet').classList.toggle('lefty', !!S.leftHanded);

  doLayout(true);
  if (window.ResizeObserver) new ResizeObserver(() => doLayout(false)).observe($('boardwrap'));
  window.addEventListener('resize', () => doLayout(false));
  window.addEventListener('orientationchange', () => setTimeout(() => doLayout(true), 120));

  // pointer input on the board
  const cv = $('board');
  cv.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    const [x, y] = R.pointerXY(e.clientX, e.clientY);
    onDown(R.hit(e.clientX, e.clientY), x, y);
  });
  cv.addEventListener('pointermove', e => { if (R.drag) { const [x, y] = R.pointerXY(e.clientX, e.clientY); onMove(x, y); } });
  const up = e => onUp(R.hit(e.clientX, e.clientY));
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', () => { R.drag = null; R.needs = true; });
  cv.addEventListener('contextmenu', e => e.preventDefault());

  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
  window.addEventListener('pagehide', saveGame);

  newGame(true);
  UI.homeDialog();
})();
</script>
</body>
